name: MegaLinter

"on":
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs packaged subcharts under charts/*/charts/*.tgz. Also
      # fails if the Chart.lock digest is wrong.
      - name: Helm dependency fetch
        shell: bash
        run: |
          set -euo pipefail
          for chart in charts/*; do
            if [ -f "${chart}/Chart.lock" ]; then
              yq -r '.dependencies[] | select(.repository | contains("oci://") == false) | "\(.name) \(.repository)"' \
                "${chart}/Chart.yaml" | xargs -L1 helm repo add --force-update
              helm dependency build "${chart}"
            fi
          done

      # MegaLinter
      - name: MegaLinter
        id: ml
        # Use the Documentation flavor.
        uses: oxsecurity/megalinter/flavors/documentation@9949bad031045f366be2467e00e8371a7328a2e2  # v10.1.0
        env:
          # Actions-specific values belong here. Generic MegaLinter configuration
          # belongs in .mega-linter.yml so local runs get the same behavior.
          #
          # All available variables are described in documentation
          # https://megalinter.io/configuration/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow GITHUB_TOKEN for working around rate limits (aquasecurity/trivy#7668).
          REPOSITORY_TRIVY_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
          # Allow GITHUB_TOKEN so zizmor can resolve action tags for the
          # artipacked audit (online mode).
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
