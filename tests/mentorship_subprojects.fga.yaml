name: Mentorship program admins cascade to sub-projects
model_file: ../charts/lfx-platform/files/model.fga

# A foundation with a sub-project and a sub-sub-project, each with a program,
# and a separate foundation. carla administers the foundation's programs, sam
# only the sub-project's.
tuples:
  - user: user:carla
    relation: mentorship_program_admin
    object: project:foundation
  - user: user:sam
    relation: mentorship_program_admin
    object: project:sub
  - user: project:foundation
    relation: parent
    object: project:sub
  - user: project:sub
    relation: parent
    object: project:subsub
  - user: project:foundation
    relation: project
    object: mentorship_program:foundation-2026
  - user: project:sub
    relation: project
    object: mentorship_program:sub-2026
  - user: project:subsub
    relation: project
    object: mentorship_program:subsub-2026
  - user: project:other
    relation: project
    object: mentorship_program:other-2026

tests:
  - name: a project's mentorship program admins administer its sub-projects at any depth
    check:
      - user: user:carla
        object: project:sub
        assertions:
          mentorship_program_admin: true
          mentorship_program_creator: true
      - user: user:carla
        object: project:subsub
        assertions:
          mentorship_program_admin: true
          mentorship_program_creator: true
      - user: user:carla
        object: mentorship_program:sub-2026
        assertions:
          writer: true
          manager: true
          auditor: true
      - user: user:carla
        object: mentorship_program:subsub-2026
        assertions:
          writer: true
          manager: true
          auditor: true

  - name: the cascade grants nothing beyond mentorship programs
    check:
      - user: user:carla
        object: project:sub
        assertions:
          writer: false
          auditor: false

  - name: a sub-project's mentorship program admins do not reach up or across
    check:
      - user: user:sam
        object: project:foundation
        assertions:
          mentorship_program_admin: false
          mentorship_program_creator: false
      - user: user:sam
        object: mentorship_program:foundation-2026
        assertions:
          writer: false
          manager: false
      - user: user:sam
        object: mentorship_program:sub-2026
        assertions:
          writer: true
      - user: user:sam
        object: mentorship_program:subsub-2026
        assertions:
          writer: true
      - user: user:carla
        object: mentorship_program:other-2026
        assertions:
          writer: false
          manager: false
          auditor: false
